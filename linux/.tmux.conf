# No visual bell
set -g visual-bell off
set -g bell-action none

# Allow alternate screen (default in tmux)
set -g alternate-screen on

# Disable flow control
set -g flow-control off

# Prefix key: C-^ (Control-Shift-6)
unbind C-b
set -g prefix C-^
bind C-^ send-prefix

# Scrollback buffer
set -g history-limit 8000

# Allow xterm scrollback
set -g terminal-overrides 'xterm*:smcup@:rmcup@'

# Status bar (bottom line, similar to hardstatus)
set -g status on
set -g status-style "bg=default"
set -g status-left ""
set -g status-right "#[fg=green]%I%p %a, %Y-%m-%d"
set -g window-status-format "#[fg=blue]#I*#W"
set -g window-status-current-format "#[fg=white,bg=blue,bold]#I*#W"

# Create named windows (indices 1-9)
set -g base-index 1
new-session -d -s main -n epg_1
new-window -t main:2 -n epg_2
new-window -t main:3 -n epg_3
new-window -t main:4 -n epg_4
new-window -t main:5 -n lab_0
new-window -t main:6 -n lab_1
new-window -t main:7 -n misc_0
new-window -t main:8 -n misc_1
new-window -t main:9 -n misc_2

# F1-F9 to select windows 1-9
bind -n F1 select-window -t 1
bind -n F2 select-window -t 2
bind -n F3 select-window -t 3
bind -n F4 select-window -t 4
bind -n F5 select-window -t 5
bind -n F6 select-window -t 6
bind -n F7 select-window -t 7
bind -n F8 select-window -t 8
bind -n F9 select-window -t 9
